[project]
name = "bitfinex-api-py"
version = "4.0.0"
description = "Official Bitfinex Python API"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bitfinex", email = "support@bitfinex.com" }
]
keywords = ["bitfinex", "api", "trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyee>=11.1.0",
    "websockets>=12.0",
    "requests>=2.33.0"
]

[project.urls]
Homepage = "https://github.com/bitfinexcom/bitfinex-api-py"
"Bug Reports" = "https://github.com/bitfinexcom/bitfinex-api-py/issues"
Source = "https://github.com/bitfinexcom/bitfinex-api-py"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "type" },
    "pre-commit>=3.5.0"
]
lint = [
    "ruff>=0.15.0"
]
type = [
    "mypy>=1.11.0",
    "types-urllib3>=1.26.25.14",
    "types-requests~=2.33.0.20260327"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bfxapi"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
